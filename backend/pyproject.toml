[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "unshaken-api"
version = "0.1.0"
description = "Unshaken workout-planning API foundation"
readme = "README.md"
# Python 3.13 is the single supported runtime across local development, CI, and containers.
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  # Alembic's synchronous migration engine requires the PostgreSQL DBAPI driver.
  "psycopg[binary]==3.2.4",
  # The asyncio extra supplies greenlet, required by SQLAlchemy's async engine bridge.
  "sqlalchemy[asyncio]==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Keeping SQL statements intact makes route queries easier to audit against migrations.
"app/api/routes/plans.py" = ["E501"]
"app/api/routes/profile_custom.py" = ["E501"]
"app/api/routes/sessions.py" = ["E501"]
"app/api/workout_common.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
exclude = ["migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "alembic.*"]
ignore_missing_imports = true
