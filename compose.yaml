name: unshaken

services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrations:
    build:
      context: ./backend
      target: development
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set BACKEND_CORS_ORIGINS in .env}
      EXERCISE_DB_BASE_URL: ${EXERCISE_DB_BASE_URL:-}
      EXERCISE_DB_API_KEY: ${EXERCISE_DB_API_KEY:-}
      EXERCISE_DB_HOST: ${EXERCISE_DB_HOST:-}
      EXERCISE_DB_MEDIA_ENABLED: ${EXERCISE_DB_MEDIA_ENABLED:-false}
      DEVELOPMENT_USER_ID: ${DEVELOPMENT_USER_ID:-}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-local@unshaken.invalid}
      DEVELOPMENT_USER_DISPLAY_NAME: ${DEVELOPMENT_USER_DISPLAY_NAME:-Local User}
      # Prefer bind-mounted source over the installed package during local development.
      PYTHONPATH: /app
    depends_on:
      database:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set BACKEND_CORS_ORIGINS in .env}
      EXERCISE_DB_BASE_URL: ${EXERCISE_DB_BASE_URL:-}
      EXERCISE_DB_API_KEY: ${EXERCISE_DB_API_KEY:-}
      EXERCISE_DB_HOST: ${EXERCISE_DB_HOST:-}
      EXERCISE_DB_MEDIA_ENABLED: ${EXERCISE_DB_MEDIA_ENABLED:-false}
      DEVELOPMENT_USER_ID: ${DEVELOPMENT_USER_ID:-}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-local@unshaken.invalid}
      DEVELOPMENT_USER_DISPLAY_NAME: ${DEVELOPMENT_USER_DISPLAY_NAME:-Local User}
      # Prefer bind-mounted source over the installed package during local development.
      PYTHONPATH: /app
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:?Set FRONTEND_API_BASE_URL in .env}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
  postgres-data:
